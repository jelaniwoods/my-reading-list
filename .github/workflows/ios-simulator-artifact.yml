name: iOS Simulator artifact

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dependabot/**"
    paths:
      - "ios/**"
      - "bin/ios"
      - "bin/ios-simulator-artifact"
      - ".github/workflows/ios-simulator-artifact.yml"

permissions:
  contents: read

concurrency:
  group: ios-simulator-artifact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APPROVED_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the unsigned Simulator artifact
        run: bin/ios simulator-artifact
        env:
          IOS_SIMULATOR_ARTIFACT_OUTPUT_DIRECTORY: ${{ runner.temp }}/ios-simulator-artifact

      - name: Publish the artifact and provenance manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-simulator-artifact/FoundationApp.app.zip
            ${{ runner.temp }}/ios-simulator-artifact/manifest.json
          if-no-files-found: error
          retention-days: 7
