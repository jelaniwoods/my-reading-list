# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

# Solid Cable has no LISTEN/NOTIFY either, so this interval is the same metered
# query against the same off-platform database as the Queue's (see DEPLOY.md).
# It is cheaper than the Queue's because the listener is built lazily on first
# subscribe and then polls only while someone is connected, rather than for as
# long as the service is awake.
#
# Core itself never subscribes, so this line costs Core nothing either way. It
# is set conservatively because Core is a template: the interval is dead config
# in a generated app that never subscribes, and 10 queries a second in one that
# does. A second is still well inside "instant" for a Turbo broadcast. Lower it
# for genuinely interactive channels — typing indicators, live cursors — or
# against a same-region database, where Render bills no bandwidth at all.
production:
  adapter: solid_cable
  polling_interval: <%= ENV.fetch("SOLID_CABLE_POLL_INTERVAL", 1) %>.seconds
  message_retention: 1.day
