services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
    - ..:/workspaces/project:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    #
    # Gate on Postgres actually accepting connections (not just "started") so a
    # headless first boot — an agent or CI runner — never races bin/setup's
    # db:prepare against a database that hasn't finished initializing.
    depends_on:
      selenium:
        condition: service_healthy
      postgres:
        condition: service_healthy

  selenium:
    image: selenium/standalone-chromium
    restart: unless-stopped
    environment:
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    # Headless Chrome writes to /dev/shm; Docker's 64MB default makes it crash
    # ("session deleted: probably crashed") under system-test load.
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 6

  postgres:
    image: postgres:18
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
